<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沧州圆浩管道科技 | 首页</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",Arial,sans-serif;}
        body{background:#f5f7fa;color:#333;line-height:1.7;}
        .container{max-width:1240px;margin:48px auto;padding:0 16px;}
        .title{text-align:center;margin-bottom:36px;}
        .title h2{font-size:28px;color:#16365c;margin-bottom:10px;font-weight:600;}
        .title .divider{display:inline-block;width:64px;height:3px;background:#245499;}

        /* 头部导航 所有页面共用 */
        .header{background:#16365c;color:#fff;}
        .top-bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;flex-wrap:wrap;gap:10px;}
        .lang-switch{cursor:pointer;background:#245499;color:#fff;border:none;padding:5px 14px;border-radius:4px;font-size:14px;}
        .nav-wrap{background:#1a4074;}
        .nav{max-width:1240px;margin:0 auto;display:flex;padding:0 16px;flex-wrap:wrap;}
        .nav a{color:#fff;text-decoration:none;padding:17px 24px;display:block;font-size:15px;transition:background 0.24s;}
        .nav a:hover{background:#245499;}
        .nav a.active{background:#245499;}

        /* banner */
        .banner{height:430px;background:#224b88;color:#fff;display:flex;align-items:center;justify-content:center;background-image:linear-gradient(rgba(22,54,92,0.86),rgba(22,54,92,0.86));background-size:cover;background-position:center;}
        .banner-text{text-align:center;padding:0 20px;}
        .banner-text h1{font-size:42px;margin-bottom:14px;line-height:1.3;}
        .banner-text p{font-size:19px;opacity:0.92;max-width:900px;margin:0 auto;}

        .intro-block{background:#fff;padding:30px;border-radius:8px;box-shadow:0 1px 10px rgba(0,0,0,0.06);}

        /* footer */
        footer{background:#16365c;color:#fff;padding:38px 0;margin-top:70px;}
        .footer-inner{max-width:1240px;margin:0 auto;padding:0 16px;text-align:center;font-size:14.5px;}

        /* 响应式 */
        @media(max-width:992px){
            .banner-text h1{font-size:34px;}
        }
        @media(max-width:640px){
            .nav{flex-wrap:wrap;}
            .banner{height:360px;}
            .banner-text h1{font-size:27px;}
            .banner-text p{font-size:16px;}
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="top-bar">
            <div id="top-welcome"></div>
            <div style="display:flex;gap:14px;align-items:center;">
                <span>+86 15138786332 | 502485967@qq.com</span>
                <button class="lang-switch" id="langBtn"></button>
            </div>
        </div>
    </div>
    <div class="nav-wrap">
        <div class="nav" id="mainNav">
            <!--导航由JS渲染-->
        </div>
    </div>

    <section class="banner">
        <div class="banner-text">
            <h1 id="banner-title"></h1>
            <p id="banner-sub"></p>
        </div>
    </section>

    <section class="container">
        <div class="title">
            <h2 id="home-title"></h2>
            <span class="divider"></span>
        </div>
        <div class="intro-block" id="home-desc"></div>
    </section>

    <footer>
        <div class="footer-inner" id="footer-text"></div>
    </footer>

<script>
// 双语全局配置，所有链接全部替换 yH-xxx.html
const i18n = {
    "zh-CN": {
        topWelcome: "欢迎访问沧州圆浩管道科技有限责任公司官网",
        langBtnText: "English",
        nav:[
            {text:"首页","href":"yH-home.html","active":true},
            {text:"关于我们","href":"yH-about.html","active":false},
            {text:"产品中心","href":"yH-product.html","active":false},
            {text:"资质检测","href":"yH-certificate.html","active":false},
            {text:"设备实力","href":"yH-equipment.html","active":false},
            {text:"联系我们","href":"yH-contact.html","active":false},
        ],
        bannerTitle:"沧州圆浩管道科技有限责任公司",
        bannerSub:"专业管道防腐材料研发制造｜热收缩套带、防腐胶带、环氧涂料、粘弹体系列",
        homeTitle:"企业概述",
        homeDesc:`
            <p>沧州圆浩管道科技专注管道防腐防水材料研发生产，产品广泛应用于油气、化工、市政输水工程，支持国内项目与外贸出口订单。</p>
            <p>拥有全套生产产线与检测设备，三体系认证齐全，可提供一站式管道防腐解决方案。欢迎各界伙伴洽谈合作！</p>
        `,
        footerText:"©2026 沧州圆浩管道科技有限责任公司 版权所有｜追求卓越·创造价值"
    },
    "en":{
        topWelcome:"Welcome to Cangzhou Yuanhao Pipeline Technology Co.,Ltd",
        langBtnText:"中文",
        nav:[
            {text:"Home","href":"yH-home.html","active":true},
            {text:"About Us","href":"yH-about.html","active":false},
            {text:"Products","href":"yH-product.html","active":false},
            {text:"Certificates","href":"yH-certificate.html","active":false},
            {text:"Facilities","href":"yH-equipment.html","active":false},
            {text:"Contact","href":"yH-contact.html","active":false},
        ],
        bannerTitle:"Cangzhou Yuanhao Pipeline Technology Co.,Ltd",
        bannerSub:"Professional Manufacturer of Pipeline Anti‑Corrosion Materials",
        homeTitle:"Company Overview",
        homeDesc:`
            <p>Cangzhou Yuanhao Pipeline Technology focuses on R&D and manufacturing of pipeline anti-corrosion materials. Our products serve oil & gas, chemical and water supply projects, available for domestic and overseas export orders.</p>
            <p>We have full production lines and testing instruments with complete ISO certifications, providing one-stop pipeline corrosion protection solutions. Welcome cooperation!</p>
        `,
        footerText:"©2026 Cangzhou Yuanhao Pipeline Technology Co.,Ltd All Rights Reserved | Pursue Excellence · Create Value"
    }
};

let currentLang = localStorage.getItem("siteLang") || "zh-CN";
const htmlDom = document.documentElement;

function renderPage(lang){
    const t = i18n[lang];
    htmlDom.lang = lang;
    document.getElementById("top-welcome").innerText = t.topWelcome;
    document.getElementById("langBtn").innerText = t.langBtnText;

    let navHtml = "";
    t.nav.forEach(item=>{
        navHtml += `<a href="${item.href}" ${item.active?'class="active"':''}>${item.text}</a>`;
    });
    document.getElementById("mainNav").innerHTML = navHtml;

    document.getElementById("banner-title").innerText = t.bannerTitle;
    document.getElementById("banner-sub").innerText = t.bannerSub;
    document.getElementById("home-title").innerText = t.homeTitle;
    document.getElementById("home-desc").innerHTML = t.homeDesc;
    document.getElementById("footer-text").innerText = t.footerText;
}

document.getElementById("langBtn").addEventListener("click",function(){
    currentLang = currentLang === "zh-CN" ? "en" : "zh-CN";
    localStorage.setItem("siteLang",currentLang);
    renderPage(currentLang);
})
renderPage(currentLang);
</script>
</body>
</html>
