<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沧州圆浩管道科技 | 产品中心</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",Arial,sans-serif;}
        body{background:#f5f7fa;color:#333;line-height:1.7;}
        .container{max-width:1240px;margin:48px auto;padding:0 16px;}
        .title{text-align:center;margin-bottom:36px;}
        .title h2{font-size:28px;color:#16365c;margin-bottom:10px;font-weight:600;}
        .title .divider{display:inline-block;width:64px;height:3px;background:#245499;}

        .header{background:#16365c;color:#fff;}
        .top-bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;flex-wrap:wrap;gap:10px;}
        .lang-switch{cursor:pointer;background:#245499;color:#fff;border:none;padding:5px 14px;border-radius:4px;font-size:14px;}
        .nav-wrap{background:#1a4074;}
        .nav{max-width:1240px;margin:0 auto;display:flex;padding:0 16px;flex-wrap:wrap;}
        .nav a{color:#fff;text-decoration:none;padding:17px 24px;display:block;font-size:15px;transition:background 0.24s;}
        .nav a:hover{background:#245499;}
        .nav a.active{background:#245499;}

        .product-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;}
        .product-card{background:#fff;border-radius:7px;overflow:hidden;box-shadow:0 1px 10px rgba(0,0,0,0.06);transition:transform 0.28s,box-shadow 0.28s;}
        .product-card:hover{transform:translateY(-6px);box-shadow:0 5px 18px rgba(0,0,0,0.09);}
        .pro-img{height:186px;background:#e8edf3;display:flex;align-items:center;justify-content:center;color:#555;font-size:16px;padding:0;overflow:hidden;}
        .pro-img img{width:100%;height:100%;object-fit:cover;}
        .pro-info{padding:18px 20px;}
        .pro-info h4{font-size:17.5px;color:#16365c;margin-bottom:10px;}
        .pro-info p{font-size:14.5px;color:#525252;line-height:1.65;}

        footer{background:#16365c;color:#fff;padding:38px 0;margin-top:70px;}
        .footer-inner{max-width:1240px;margin:0 auto;padding:0 16px;text-align:center;font-size:14.5px;}

        @media(max-width:992px){
            .product-wrap{grid-template-columns:repeat(2,1fr);}
        }
        @media(max-width:640px){
            .product-wrap{grid-template-columns:1fr;}
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="top-bar">
            <div id="top-welcome"></div>
            <div style="display:flex;gap:14px;align-items:center;">
                <span>+86 15138786332 | 502485967@qq.com</span>
                <button class="lang-switch" id="langBtn"></button>
            </div>
        </div>
    </div>
    <div class="nav-wrap">
        <div class="nav" id="mainNav"></div>
    </div>

    <section class="container">
        <div class="title">
            <h2 id="prod-title"></h2>
            <span class="divider"></span>
        </div>
        <div class="product-wrap" id="productWrap"></div>
    </section>

    <footer>
        <div class="footer-inner" id="footer-text"></div>
    </footer>

<script>
const i18n = {
    "zh-CN": {
        topWelcome: "欢迎访问沧州圆浩管道科技有限责任公司官网",
        langBtnText: "English",
        nav:[
            {text:"首页","href":"yh-home.html","active":false},
            {text:"关于我们","href":"yh-about.html","active":false},
            {text:"产品中心","href":"yh-product.html","active":true},
            {text:"资质检测","href":"yh-certificate.html","active":false},
            {text:"设备实力","href":"yh-equipment.html","active":false},
            {text:"联系我们","href":"yh-contact.html","active":false},
        ],
        prodTitle:"产品中心",
        products:[
            {img:"images/sleeve.jpg",imgTxt:"热收缩套/热收缩带",title:"辐射交联聚乙烯热收缩套、热收缩带",desc:"管道焊口补口防腐，DN25‑DN2000，抗土壤应力、耐化学腐蚀，适配埋地钢质管道三层PE防腐系统。包含开口套、定向钻穿越增强型热收缩带。"},
            {img:"images/tape.jpg",imgTxt:"防腐胶带系列",title:"聚乙烯/聚丙烯防腐胶带、一体带",desc:"施工简便无固化，手工机械均可施工，用于埋地管道外防腐，满足SY/T0414行业标准，颜色黑色、黄色可选。"},
            {img:"images/epoxy.jpg",imgTxt:"环氧涂料",title:"无溶剂环氧底漆、环氧煤沥青冷缠带",desc:"配套热缩产品使用，附着力强、绝缘性能好，阴极剥离性能优异，黑色防腐涂层。"},
            {img:"images/visco.jpg",imgTxt:"粘弹体系列",title:"粘弹体防腐胶带、粘弹体膏",desc:"低表面处理，无需底漆，密封性强，异形管件适配，‑30℃可施工，具备自修复能力。"},
            {img:"images/repair.jpg",imgTxt:"管道修补产品",title:"CRP补伤片、补伤棒、防水帽",desc:"专门修复聚乙烯防腐层划伤点损伤，加热热熔粘接，与原防腐层融为一体。"},
            {img:"images/special.jpg",imgTxt:"特种防护产品",title:"光敏固化玻璃钢保护套、热缩压敏胶带",desc:"定向钻穿越保护、补口修复，自修复，低能耗施工，适用于新建及在役管线修复。"},
        ],
        footerText:"©2026 沧州圆浩管道科技有限责任公司 版权所有｜追求卓越·创造价值"
    },
    "en":{
        topWelcome:"Welcome to Cangzhou Yuanhao Pipeline Technology Co.,Ltd",
        langBtnText:"中文",
        nav:[
            {text:"Home","href":"yh-home.html","active":false},
            {text:"About Us","href":"yh-about.html","active":false},
            {text:"Products","href":"yh-product.html","active":true},
            {text:"Certificates","href":"yh-certificate.html","active":false},
            {text:"Facilities","href":"yh-equipment.html","active":false},
            {text:"Contact","href":"yh-contact.html","active":false},
        ],
        prodTitle:"Our Products",
        products:[
            {img:"images/sleeve.jpg",imgTxt:"Heat‑Shrink Sleeves & Tapes",title:"Radiation Cross‑linked PE Heat‑Shrinkable Sleeves / Tapes",desc:"For girth‑weld joint anti‑corrosion. Size range DN25‑DN2000. Resist soil stress & chemical corrosion. Include wraparound sleeves and directional‑drilling reinforced heat‑shrink tapes."},
            {img:"images/tape.jpg",imgTxt:"Anti‑Corrosion Tapes",title:"PE / PP Anti‑Corrosion Tape & Integrated Tape",desc:"Easy installation, no curing time. Manual or machine wrapping. Comply with SY/T0414 standard. Black / yellow color available for buried steel pipelines."},
            {img:"images/epoxy.jpg",imgTxt:"Epoxy Coating",title:"Solvent‑Free Epoxy Primer & Epoxy Coal‑Tar Cold‑Wrap Tape",desc:"Supporting primer for heat‑shrink products. High adhesion, excellent insulation and cathodic‑disbonding resistance. Black anti‑corrosion coating system."},
            {img:"images/visco.jpg",imgTxt:"Visco‑Elastic Series",title:"Visco‑Elastic Anti‑Corrosion Tape & Mastic",desc:"Low surface treatment requirement, no primer needed. Excellent sealing, fits irregular fittings. Workable down to ‑30℃ with self‑healing performance."},
            {img:"images/repair.jpg",imgTxt:"Pipe Repair Products",title:"CRP Repair Patch, Repair Stick, End‑Cap",desc:"Designed for repairing scratches and local damage on PE pipeline coating. Heat‑activated mastic forms integrated anti‑corrosion layer with original coating."},
            {img:"images/special.jpg",imgTxt:"Special Protection Items",title:"UV‑Cured FRP Sleeve & Heat‑Shrink Pressure‑Sensitive Tape",desc:"Protection for directional‑drilling crossing, in‑service pipeline rehabilitation. Self‑repair feature, low‑energy consumption during site application."},
        ],
        footerText:"©2026 Cangzhou Yuanhao Pipeline Technology Co.,Ltd All Rights Reserved | Pursue Excellence · Create Value"
    }
};
let currentLang = localStorage.getItem("siteLang") || "zh-CN";
const htmlDom = document.documentElement;
function renderPage(lang){
    const t = i18n[lang];
    htmlDom.lang = lang;
    document.getElementById("top-welcome").innerText = t.topWelcome;
    document.getElementById("langBtn").innerText = t.langBtnText;
    let navHtml = "";
    t.nav.forEach(item=> navHtml += `<a href="${item.href}" ${item.active?'class="active"':''}>${item.text}</a>`);
    document.getElementById("mainNav").innerHTML = navHtml;
    document.getElementById("prod-title").innerText = t.prodTitle;
    let prodHtml = "";
    t.products.forEach(p=>{
        prodHtml += `
        <div class="product-card">
            <div class="pro-img">
                <img src="${p.img}" alt="${p.imgTxt}">
            </div>
            <div class="pro-info">
                <h4>${p.title}</h4>
                <p>${p.desc}</p>
            </div>
        </div>
        `
    })
    document.getElementById("productWrap").innerHTML = prodHtml;
    document.getElementById("footer-text").innerText = t.footerText;
}
document.getElementById("langBtn").addEventListener("click",function(){
    currentLang = currentLang === "zh-CN" ? "en" : "zh-CN";
    localStorage.setItem("siteLang",currentLang);renderPage(currentLang);
})
renderPage(currentLang);
</script>
</body>
</html>
