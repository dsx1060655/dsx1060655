<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沧州圆浩管道科技 | 欢迎光临</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",Arial,sans-serif;}
        body {
            height:100vh;
            background:#16365c;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            color:#fff;
            text-align:center;
        }
        h1 {
            font-size:48px;
            margin-bottom:20px;
        }
        .sub {
            font-size:24px;
            opacity:0.9;
            margin-bottom:40px;
        }
        .tip {
            font-size:16px;
            opacity:0.7;
        }
        a{
            display:inline-block;
            padding:14px 36px;
            background:#245499;
            color:#fff;
            text-decoration:none;
            border-radius:6px;
            font-size:18px;
        }
        a:hover{background:#2b64b4;}
    </style>
</head>
<body>
    <h1>欢迎光临</h1>
    <div class="sub">合作共赢</div>
    <a href="yH-home.html">进入官网</a>
    <p class="tip">页面5秒后自动跳转官网首页</p>
    <script>
        // 读取全局语言
        let currentLang = localStorage.getItem("siteLang") || "zh-CN";
        const textData = {
            "zh-CN":{title:"沧州圆浩管道科技 | 欢迎光临",h1:"欢迎光临",sub:"合作共赢",btn:"进入官网",tip:"页面5秒后自动跳转官网首页"},
            "en":{title:"Cangzhou Yuanhao Pipeline Tech | Welcome",h1:"Welcome",sub:"Win-Win Cooperation",btn:"Enter Website",tip:"Auto redirect to home page in 5 seconds"}
        };
        function render(lang){
            const t = textData[lang];
            document.title = t.title;
            document.querySelector("h1").innerText = t.h1;
            document.querySelector(".sub").innerText = t.sub;
            document.querySelector("a").innerText = t.btn;
            document.querySelector(".tip").innerText = t.tip;
            document.documentElement.lang = lang;
        }
        render(currentLang);
        setTimeout(()=>{
            window.location.href="yH-home.html";
        },5000);
    </script>
</body>
</html>
